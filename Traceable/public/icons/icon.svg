<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131D33"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>

  <!-- Radial ambient glow behind symbol -->
  <circle cx="256" cy="256" r="185" fill="url(#glowGrad)"/>

  <!-- Subtle Palette dots representing creativity -->
  <circle cx="120" cy="130" r="14" fill="#EC4899" opacity="0.8"/>
  <circle cx="390" cy="130" r="14" fill="#FACC15" opacity="0.8"/>
  <circle cx="410" cy="380" r="14" fill="#10B981" opacity="0.8"/>
  <circle cx="110" cy="380" r="14" fill="#8B5CF6" opacity="0.8"/>

  <!-- Main Pen Nib Symbol (from Traceable brand identity) -->
  <g transform="translate(100, 100) scale(13)" stroke="url(#nibGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19l7-7 3 3-7 7-3-3z" fill="rgba(56, 189, 248, 0.16)"/>
    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" fill="url(#wellGlow)"/>
    <path d="M2 2l7.5 8.5" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M14 11l-4 4" stroke="#7DD3FC" stroke-width="2"/>
  </g>
</svg>
